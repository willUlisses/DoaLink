services:
  postgres:
    image: postgres:17-alpine
    container_name: doalink-banco
    environment:
      POSTGRES_DB: doalink_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  mailpit:
    image: axllent/mailpit:edge
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"


volumes:
  pgdata:
