spring.application.name=doalink-api


spring.datasource.url=jdbc:postgresql://localhost:5433/doalink_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false


# JWT
app.jwt.secret=${JWT_SECRET:doalink-secret-jwt-key-for-development-32charsmin}
app.jwt.access-minutes=15
app.refresh.days=7
app.cookie.secure=true
app.cors.origins=http://localhost:3000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=noreply@doalink.com

# Recuperação de senha
app.recuperacao-senha.expiracao-minutos=10
app.recuperacao-senha.url-base=${APP_URL:http://localhost:3000}

# Segurança do transporte
app.transporte.codigo.max-tentativas=5
app.transporte.codigo-entrega.validade-horas=24
app.transporte.verificacao-expiracao-ms=60000
