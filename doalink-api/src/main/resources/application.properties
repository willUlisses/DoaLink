spring.application.name=doalink-api


spring.datasource.url=jdbc:postgresql://localhost:5433/doalink_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false


# JWT
app.jwt.secret=${JWT_SECRET:doalink-secret-jwt-key-for-development-32charsmin}
app.jwt.access-minutes=15
app.refresh.days=7
app.cookie.secure=true
app.cors.origins=http://localhost:3000

# Mail (Mailpit - desenvolvimento)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Recuperação de senha
app.recuperacao-senha.expiracao-minutos=10
app.recuperacao-senha.url-base=${APP_URL:http://localhost:3000}
